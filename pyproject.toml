[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axor-wrap"
version = "0.1.0"
description = "Wrap engine for the Axor ecosystem: scan agent code, emit tool manifests, compile governance, wrap the runtime"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["agents", "governance", "llm", "ai", "security", "langchain", "mcp"]

# axor-core is REQUIRED, not an extra. This package's headline artifact is a
# kernel-gated runtime — every tool call goes evaluate → deny? → call →
# register_output through the real kernel — and the governor config it compiles
# is meaningless without the governor that consumes it. Shipping that behind an
# extra meant `pip install axor-wrap` produced something that scans code and
# then raises when asked to gate it, and it let the plane tests sit red on a
# machine where nothing was obviously missing.
dependencies = [
    "axor-core>=0.10.2,<0.11",
]

[project.optional-dependencies]
# Control-Plane attachment (axor_wrap.plane). The plane primitives themselves
# live in THIS package — axor-core contributes only the primitives they reason
# over (desired-state lattice, JCS canonical bytes, the event schema). What is
# optional here is the TRANSPORT, not the kernel: httpx for the SSE/telemetry
# dial-out, cryptography to verify operator command signatures against LOCAL
# keys. A wrap that never attaches to a plane needs neither.
plane = [
    "httpx>=0.27",
    "cryptography>=42.0",
]
dev = [
    "ruff>=0.5",
    # axor_wrap.plane's tests came over from axor-core with the code, verbatim —
    # they pin protocol-v0.2 governance invariants, so they were moved rather
    # than rewritten, and they are pytest-native (async, asyncio_mode=auto).
    # pytest also collects the stdlib-unittest tests, so it runs the whole suite.
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # the plane tests verify ed25519 operator signatures
    "cryptography>=42.0",
]

[project.scripts]
axor-wrap = "axor_wrap.cli:main"

[project.urls]
Repository = "https://github.com/Bucha11/axor-wrap"

[tool.hatch.build.targets.wheel]
packages = ["axor_wrap"]

# TEMPORARY local-dev override: axor_wrap.plane needs axor-core 0.10 (the release
# that drops axor_core.plane in favour of this package), which is not on PyPI
# yet, so resolution points at the sibling checkout. Drop this line once 0.10 is
# published.
[tool.uv.sources]
axor-core = { path = "../axor-core", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# meaningful correctness rules (pyflakes + bugbear + comprehensions), not style
# noise; the codebase uses dict[str, object] at contract boundaries by design.
select = ["F", "E9", "B", "C4", "UP032", "PLE"]
ignore = ["B008", "B905", "C401", "C408"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "F841"]
