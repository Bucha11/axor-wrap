name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  # Re-run when a new axor-core is published: it is a required dependency and
  # the wrapped runtime reads the kernel's trace surface, so a release can
  # change what this package produces. axor-core's publish job fans this out.
  repository_dispatch:
    types: [axor-core-published]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # axor-core is a REQUIRED dependency, but 0.10 is not on PyPI yet
        # (locally resolved via [tool.uv.sources]), so it must be installed from
        # git BEFORE the editable install — otherwise pip tries to resolve the
        # requirement from PyPI and the whole install fails. The plane transport
        # deps go in directly rather than via the [plane] extra.
        run: |
          pip install "axor-core @ git+https://github.com/Bucha11/axor-core@main"
          pip install -e ".[dev]"
          pip install "httpx>=0.27" "cryptography>=42.0"

      - name: Lint
        run: ruff check axor_wrap/ tests/ --quiet

      - name: Run tests
        run: pytest tests/ -v --tb=short

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          python - << 'EOF'
          import pathlib
          import re
          import sys
          import tomllib

          ref = "${{ github.ref_name }}"
          m = re.fullmatch(r"v(\d+\.\d+\.\d+)", ref)
          if not m:
              print(f"Tag {ref!r} must match vX.Y.Z")
              sys.exit(1)

          tag_version = m.group(1)
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          pkg_version = data["project"]["version"]

          if tag_version != pkg_version:
              print(f"Version mismatch: tag={tag_version}, pyproject={pkg_version}")
              sys.exit(1)

          print(f"Version check passed: {pkg_version}")
          EOF

      - name: Build
        run: |
          pip install hatchling build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
